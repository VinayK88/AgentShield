<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">AgentShield dashboard preview</title><desc id="desc">Static synthetic dashboard preview for AI-agent runtime security and learned trajectory risk.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><text x="48" y="58" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#f8fafc">AgentShield</text><text x="48" y="87" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#67e8f9">RUNTIME SECURITY · SEQUENCE ML · POLICY-FIRST</text><text x="1115" y="63" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><g font-family="Inter,Arial,sans-serif"><rect x="48" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">POLICY ENGINE</text><text x="68" y="184" font-size="24" font-weight="800" fill="#4ade80">AUTHORITATIVE</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">TRAJECTORY MODEL</text><text x="343" y="184" font-size="24" font-weight="800" fill="#93c5fd">ADVISORY</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">HUMAN CONTROL</text><text x="618" y="184" font-size="24" font-weight="800" fill="#f8fafc">APPROVAL GATE</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">EVALUATION DATA</text><text x="893" y="184" font-size="24" font-weight="800" fill="#f8fafc">SYNTHETIC</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#0b1727" stroke="#29425b"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Runtime evidence</text><text x="72" y="298" font-size="12" fill="#94a3b8">Signals evaluated before tool execution</text><g font-size="14" font-weight="650" fill="#dbeafe"><circle cx="78" cy="343" r="6" fill="#22c55e"/><text x="96" y="348">Declared intent vs proposed action</text><circle cx="78" cy="391" r="6" fill="#60a5fa"/><text x="96" y="396">Sensitive-data and external-destination context</text><circle cx="78" cy="439" r="6" fill="#a78bfa"/><text x="96" y="444">Learned tool-call trajectory surprisal</text><circle cx="78" cy="487" r="6" fill="#f59e0b"/><text x="96" y="492">Delegation, destructive capability, recent history</text></g><rect x="607" y="236" width="545" height="306" rx="18" fill="#0b1727" stroke="#29425b"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Decision plane</text><text x="631" y="298" font-size="12" fill="#94a3b8">Hard policy remains separate from learned evidence</text><rect x="631" y="328" width="224" height="64" rx="12" fill="#10291f" stroke="#166534"/><text x="653" y="366" font-size="20" font-weight="800" fill="#4ade80">ALLOW</text><rect x="879" y="328" width="224" height="64" rx="12" fill="#13243b" stroke="#1d4ed8"/><text x="901" y="366" font-size="20" font-weight="800" fill="#93c5fd">REDACT</text><rect x="631" y="414" width="224" height="64" rx="12" fill="#302410" stroke="#a16207"/><text x="653" y="452" font-size="20" font-weight="800" fill="#fbbf24">APPROVAL</text><rect x="879" y="414" width="224" height="64" rx="12" fill="#32171c" stroke="#b91c1c"/><text x="901" y="452" font-size="20" font-weight="800" fill="#f87171">BLOCK</text><rect x="631" y="501" width="472" height="18" rx="9" fill="#172033"/><rect x="631" y="501" width="340" height="18" rx="9" fill="url(#accent)"/><text x="48" y="592" font-size="12" fill="#94a3b8">Preview summarizes implemented controls and model boundaries; it does not represent live production traffic or efficacy metrics.</text></g></svg>