[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Runtime security gateway for AI agents and MCP tool calls"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
agentshield = "agentshield.cli:main"

[tool.setuptools.packages.find]
include = ["agentshield*"]
